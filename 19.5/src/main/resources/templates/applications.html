<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Job Applications</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #111827; }
        .page { max-width: 1000px; margin: 40px auto; padding: 20px; }
        h1 { margin-bottom: 12px; }
        .toolbar { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
        .button { padding: 10px 18px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; }
        .button.secondary { background: #374151; }
        select { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f3f4f6; }
        tr:hover { background: #f8fafc; }
        .action-button { padding: 6px 12px; border: none; border-radius: 6px; color: white; cursor: pointer; }
        .delete { background: #dc2626; }
    </style>
</head>
<body>
<div class="page">
    <h1>Job Applications</h1>
    <div class="toolbar">
        <a class="button" href="/applications/new">Submit New Application</a>
        <a class="button secondary" href="/jobs">View Job Listings</a>
        <form th:action="@{/applications}" method="get" style="margin:0; display:inline-flex; align-items:center; gap:10px;">
            <label for="jobId">Select Job:</label>
            <select id="jobId" name="jobId">
                <option th:each="job : ${jobs}" th:value="${job.id}" th:selected="${job.id == selectedJobId}" th:text="${job.title + ' (' + job.company + ')'}"></option>
            </select>
            <button type="submit" class="button secondary">Load</button>
        </form>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Applicant Name</th>
                <th>Email</th>
                <th>Application Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        <tr th:if="${applications == null}">
            <td colspan="5" style="text-align:center; padding: 24px;">Chọn công việc để xem ứng viên.</td>
        </tr>
        <tr th:if="${applications != null} && ${applications.empty}">
            <td colspan="5" style="text-align:center; padding: 24px;">Chưa có ứng dụng nào cho công việc này.</td>
        </tr>
        <tr th:each="application : ${applications}">
            <td th:text="${application.id}"></td>
            <td th:text="${application.applicantName}"></td>
            <td th:text="${application.email}"></td>
            <td th:text="${application.applicationDate}"></td>
            <td>
                <a th:href="@{'/applications/delete/' + ${application.id}}" class="action-button delete">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
